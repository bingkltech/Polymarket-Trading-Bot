environment:
  enable_live_trading: true

wallets:
  - id: live_mispricing
    mode: LIVE
    strategy: mispricing_arbitrage
    capital: 20
    risk_limits:
      max_position_size: 5
      max_exposure_per_market: 20
      max_daily_loss: 5
      max_open_trades: 5
      max_drawdown: 0.10

strategy_config:
  mispricing_arbitrage:
    min_dislocation: 0.02
  ai_forecast:
    refresh_minutes: 30
  market_making:
    spread_bps: 40
  momentum:
    lookback_minutes: 15
  filtered_high_prob_convergence:
    enabled: true
    min_liquidity_usd: 10000
